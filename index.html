<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Copa do Aniversario</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root {
    --color-bg: #090e0c;
    --color-surface: #111a16;
    --color-surface-hover: #16241e;
    --color-border: #1f2e26;
    --color-border-light: #2d4237;
    --color-text-main: #f4f5f5;
    --color-text-muted: #9ba8a2;
    --color-text-disabled: #5a6b63;
    
    --color-danger: #cc2200;
    --color-danger-alpha: rgba(204, 34, 0, 0.15);
    --color-accent: #f5c800;
    --color-accent-alpha: rgba(245, 200, 0, 0.12);

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-8: 48px;
    --space-10: 64px;
    --font-heading: 'Anton', sans-serif;
    --font-body: 'Barlow Condensed', sans-serif;
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
}

.theme-verde    { --c-main: #00b140; --c-alpha: rgba(0, 177, 64, 0.15); }
.theme-amarelo  { --c-main: #f5c800; --c-alpha: rgba(245, 200, 0, 0.15); }
.theme-azul     { --c-main: #1a52c8; --c-alpha: rgba(26, 82, 200, 0.15); }
.theme-vermelho { --c-main: #e11d48; --c-alpha: rgba(225, 29, 72, 0.15); }
.theme-roxo     { --c-main: #a855f7; --c-alpha: rgba(168, 85, 247, 0.15); }
.theme-laranja  { --c-main: #f97316; --c-alpha: rgba(249, 115, 22, 0.15); }
.theme-rosa     { --c-main: #ec4899; --c-alpha: rgba(236, 72, 153, 0.15); }

.dyn-color         { color: var(--c-main); }
.dyn-bg            { background-color: var(--c-alpha); }
.dyn-border        { border-color: var(--c-alpha); }
.dyn-border-solid  { border-color: var(--c-main); }
.dyn-shadow        { text-shadow: 0 0 24px var(--c-alpha); }
.dyn-glow          { box-shadow: 0 0 24px var(--c-alpha); }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
    background-color: var(--color-bg);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.01) 0%, transparent 50%);
    color: var(--color-text-main);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    padding-bottom: var(--space-10);
}

/* ─── ANIMAÇÃO DE ENTRADA CINEMATOGRÁFICA ─── */
.intro-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #111a16 0%, #090e0c 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    overflow: hidden;
}
.broadcast-line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 6px;
    background: var(--color-accent);
    transform: translateY(-50%) scaleX(0);
    transform-origin: left;
    box-shadow: 0 0 30px var(--color-accent);
    z-index: 1;
}
.intro-text {
    font-family: var(--font-heading);
    font-size: clamp(3.5rem, 12vw, 8rem);
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 200, 0, 0.3);
    white-space: nowrap;
    text-align: center;
    line-height: 0.95;
    letter-spacing: 0.02em;
    visibility: hidden; /* FOUC Fix */
    z-index: 2;
}

#canvas-confetti { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
.toast-container { position: fixed; bottom: var(--space-4); right: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); z-index: 9000; pointer-events: none; }
.toast { background-color: var(--color-surface); border: 1px solid var(--color-border-light); color: var(--color-text-main); padding: var(--space-3) var(--space-4); border-radius: var(--radius-sm); font-weight: 600; letter-spacing: 0.05em; display: flex; align-items: center; gap: var(--space-3); box-shadow: var(--shadow-card); pointer-events: auto; }
.toast.success .toast-icon { color: #00b140; }
.toast.danger .toast-icon { color: var(--color-danger); }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 9500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-content { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-6); width: 90%; max-width: 400px; box-shadow: var(--shadow-card); transform: translateY(20px); }
.modal-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.modal-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.modal-body { color: var(--color-text-muted); font-size: 1.1rem; line-height: 1.5; margin-bottom: var(--space-5); }
.modal-actions { display: flex; gap: var(--space-3); justify-content: flex-end; }

.container { width: 100%; max-width: 860px; padding: 0 var(--space-4); display: flex; flex-direction: column; align-items: center; }
.header { width: 100%; text-align: center; padding: var(--space-8) 0 var(--space-6) 0; display: flex; flex-direction: column; align-items: center; }
.header-badge { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); background: var(--color-accent-alpha); border: 1px solid rgba(245, 200, 0, 0.2); color: var(--color-accent); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: var(--space-4); }
.header-title { font-family: var(--font-heading); font-size: clamp(3rem, 10vw, 6rem); line-height: 0.9; letter-spacing: 0.02em; text-transform: uppercase; color: var(--color-text-main); margin-bottom: var(--space-2); }
.header-title span { color: var(--color-accent); }
.header-subtitle { color: var(--color-text-muted); font-size: 1.2rem; letter-spacing: 0.08em; }

.tabs-container { display: flex; width: 100%; max-width: 500px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-6); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
.tab-button { flex: 1; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--color-text-muted); font-family: var(--font-body); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: var(--space-3) 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background-color 0.3s ease, color 0.3s ease; outline: none; }
.tab-button:hover { background: var(--color-surface); color: var(--color-text-main); }
.tab-button.active { background: rgba(255,255,255,0.1); color: #fff; border-bottom-color: #fff; }

.view-container { width: 100%; display: none; flex-direction: column; gap: var(--space-4); }
.view-container.active { display: flex; }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-5); width: 100%; box-shadow: var(--shadow-card); }
.card-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); padding-bottom: var(--space-3); border-bottom: 1px solid var(--color-border-light); }
.card-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }

.grid-dynamic { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-4); }
.form-group { display: flex; flex-direction: column; gap: var(--space-2); }
.form-label { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.form-input, .form-select { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--color-border-light); border-radius: var(--radius-sm); color: var(--color-text-main); font-family: var(--font-body); font-size: 1.1rem; padding: var(--space-3); outline: none; transition: border-color 0.3s ease, box-shadow 0.3s ease; width: 100%; }
.form-input:focus, .form-select:focus { border-color: #fff; }
.form-select option { background: var(--color-surface); color: var(--color-text-main); }
.form-row { display: flex; gap: var(--space-3); align-items: flex-end; flex-wrap: wrap; }
.form-row .form-group { flex: 1; min-width: 120px; }

.btn { border: none; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: transform 0.1s ease, filter 0.3s ease; outline: none; }
.btn:active { transform: scale(0.95); }
.btn-primary { background: #e8ede8; color: var(--color-bg); padding: var(--space-3) var(--space-5); height: 48px; }
.btn-primary:hover { filter: brightness(0.9); }
.btn-danger { background: var(--color-danger); color: var(--color-text-main); padding: var(--space-3) var(--space-5); }
.btn-outline { background: transparent; border: 1px solid var(--color-border-light); color: var(--color-text-muted); padding: var(--space-2) var(--space-4); font-size: 0.9rem; }
.btn-outline:hover { border-color: var(--color-text-main); color: var(--color-text-main); }
.btn-icon { background: transparent; border: 1px solid var(--color-border-light); color: var(--color-text-muted); width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; padding: 0; }
.btn-icon:hover { background: var(--color-surface-hover); color: var(--color-text-main); }
.btn-icon.danger:hover { border-color: var(--color-danger); color: var(--color-danger); background: var(--color-danger-alpha); }

.btn-action { background: transparent; border: 1px solid var(--color-border-light); width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); }
.btn-action:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #fff; }

.list-container { display: flex; flex-direction: column; gap: var(--space-2); max-height: 400px; overflow-y: auto; padding-right: var(--space-2); }
.list-container::-webkit-scrollbar { width: 4px; }
.list-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: var(--radius-sm); }
.list-container::-webkit-scrollbar-thumb { background: var(--color-border-light); border-radius: var(--radius-sm); }
.list-item { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); display: flex; align-items: center; gap: var(--space-3); }

.avatar { width: 40px; height: 40px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid; }
.item-info { flex: 1; display: flex; flex-direction: column; }
.item-name { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.05em; }
.tag { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; margin-top: 2px; width: max-content; }
.item-score { font-family: var(--font-heading); font-size: 1.5rem; color: var(--color-accent); min-width: 32px; text-align: center; }

.empty-state { padding: var(--space-6) 0; text-align: center; color: var(--color-text-muted); font-size: 1.1rem; letter-spacing: 0.05em; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }

.scoreboard-dynamic { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--space-6); margin-bottom: var(--space-6); }
.team-display { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); min-width: 120px; }
.shield { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid; }
.team-name-display { font-family: var(--font-heading); font-size: 1.5rem; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; }
.score-number { font-family: var(--font-heading); font-size: clamp(4rem, 12vw, 7rem); line-height: 1; transition: color 0.3s ease, text-shadow 0.3s ease; }
.score-number.leader { color: var(--color-accent) !important; text-shadow: var(--shadow-glow-accent) !important; }

.player-score-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.player-score-row:last-child { border-bottom: none; }
.psr-name { flex: 1; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psr-score { font-family: var(--font-heading); font-size: 1.4rem; color: var(--color-accent); min-width: 32px; text-align: center; }

.total-bar { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); width: 100%; }
.total-label { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); display: flex; align-items: center; gap: var(--space-2); }
.total-value { font-family: var(--font-heading); font-size: 2.5rem; color: #fff; line-height: 1; }

.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
.log-entry { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-4); display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
.log-seq { font-family: var(--font-heading); font-size: 1.2rem; color: var(--color-accent); min-width: 24px; }
.log-name { flex: 1; font-size: 1.1rem; font-weight: 600; }
.log-time { font-size: 0.85rem; color: var(--color-text-muted); }

@media (max-width: 600px) {
    .form-row { flex-direction: column; align-items: stretch; }
    .btn-primary { width: 100%; }
    .total-bar { flex-direction: column; gap: var(--space-3); text-align: center; }
}
</style>
</head>
<body>

<div id="intro-overlay" class="intro-overlay">
    <div class="broadcast-line"></div>
    <h1 class="intro-text">Copa da<br>Iggy Azaketty</h1>
</div>

<canvas id="canvas-confetti"></canvas>
<div id="toast-root" class="toast-container"></div>
<div id="modal-root" class="modal-overlay"></div>
<div class="container">
    <header class="header">
        <div class="header-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10A15.3 15.3 0 0 1 8 12 15.3 15.3 0 0 1 12 2z"></path>
                <path d="M2 12h20"></path>
            </svg>
            Copa da Iggy Azaketty
        </div>
        <h1 class="header-title">Contador<br>de <span>Doses</span></h1>
        <p class="header-subtitle">Cada gol vale uma dose rigorosamente cobrada.</p>
    </header>
    <nav class="tabs-container">
        <button class="tab-button" data-target="view-cadastro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Ajustes
        </button>
        <button class="tab-button active" data-target="view-placar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <path d="M3 9h18"></path>
                <path d="M9 21V9"></path>
            </svg>
            Placar
        </button>
    </nav>
    <main id="view-cadastro" class="view-container">
        <section class="card">
            <div class="card-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                <h2 class="card-title">Gestão de Equipes</h2>
            </div>
            
            <div class="form-row" style="margin-bottom: var(--space-4);">
                <div class="form-group" style="flex: 2;">
                    <label class="form-label">Nova Equipe</label>
                    <input type="text" id="input-new-team-name" class="form-input" placeholder="Nome do time" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Cor</label>
                    <select id="select-new-team-theme" class="form-select">
                        <option value="theme-verde">Verde</option>
                        <option value="theme-amarelo">Amarelo</option>
                        <option value="theme-azul">Azul</option>
                        <option value="theme-vermelho">Vermelho</option>
                        <option value="theme-roxo">Roxo</option>
                        <option value="theme-laranja">Laranja</option>
                        <option value="theme-rosa">Rosa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Ícone</label>
                    <select id="select-new-team-icon" class="form-select">
                        <option value="shield">Escudo</option>
                        <option value="crown">Coroa</option>
                        <option value="sword">Espada</option>
                        <option value="star">Estrela</option>
                        <option value="zap">Raio</option>
                        <option value="flame">Fogo</option>
                        <option value="heart">Coração</option>
                        <option value="skull">Caveira</option>
                        <option value="ghost">Fantasma</option>
                        <option value="moon">Lua</option>
                        <option value="sun">Sol</option>
                        <option value="anchor">Âncora</option>
                        <option value="target">Alvo</option>
                        <option value="award">Prêmio</option>
                        <option value="flag">Bandeira</option>
                        <option value="crosshair">Mira</option>
                        <option value="coffee">Café</option>
                        <option value="music">Música</option>
                    </select>
                </div>
                <button id="btn-add-team" class="btn btn-primary" style="height: 48px;">Adicionar</button>
            </div>
            <div id="teams-admin-list" class="list-container"></div>
        </section>

        <section class="card">
            <div class="card-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                    <line x1="12" y1="14" x2="12" y2="22"></line>
                    <line x1="8" y1="18" x2="16" y2="18"></line>
                </svg>
                <h2 class="card-title">Recrutamento</h2>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Identificação</label>
                    <input type="text" id="input-player-name" class="form-input" placeholder="Nome do jogador" maxlength="28">
                </div>
                <div class="form-group" style="flex: 0.5;">
                    <label class="form-label">Seleção de Equipe</label>
                    <select id="select-player-team" class="form-select"></select>
                </div>
                <button id="btn-add-player" class="btn btn-primary">Adicionar</button>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <h2 class="card-title">Elenco Registrado</h2>
            </div>
            <div id="players-list-admin" class="list-container"></div>
        </section>
    </main>

    <main id="view-placar" class="view-container active">
        <section class="scoreboard-dynamic" id="scoreboard-top-container"></section>
        <section class="grid-dynamic" id="team-cards-grid"></section>
        <section class="total-bar">
            <div class="total-label">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

class Vector2D {
    constructor(x, y) { this.x = x; this.y = y; }
    add(vector) { this.x += vector.x; this.y += vector.y; }
    multiply(scalar) { this.x *= scalar; this.y *= scalar; }
}

class ConfettiParticle {
    constructor(x, y, context) {
        this.context = context;
        this.position = new Vector2D(x, y);
        this.velocity = new Vector2D((Math.random() - 0.5) * 20, (Math.random() - 1) * 25);
        this.gravity = new Vector2D(0, 0.5);
        this.friction = 0.98;
        this.size = Math.random() * 8 + 6;
        const colors = ['#00b140', '#1a52c8', '#f5c800', '#cc2200', '#ffffff', '#a855f7'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 10;
        this.opacity = 1;
        this.decay = Math.random() * 0.015 + 0.01;
    }
    update() {
        this.velocity.add(this.gravity);
        this.velocity.multiply(this.friction);
        this.position.add(this.velocity);
        this.rotation += this.rotationSpeed;
        this.opacity -= this.decay;
    }
    draw() {
        this.context.save();
        this.context.translate(this.position.x, this.position.y);
        this.context.rotate((this.rotation * Math.PI) / 180);
        this.context.globalAlpha = Math.max(0, this.opacity);
        this.context.fillStyle = this.color;
        this.context.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
        this.context.restore();
    }
    isDead() { return this.opacity <= 0 || this.position.y > window.innerHeight; }
}

class ConfettiEngine {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.context = this.canvas.getContext('2d');
        this.particles = [];
        this.isRunning = false;
        this.resizeHandler = this.resize.bind(this);
        window.addEventListener('resize', this.resizeHandler);
        this.resize();
    }
    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }
    burst(x, y, count = 60) {
        for (let i = 0; i < count; i++) this.particles.push(new ConfettiParticle(x, y, this.context));
        if (!this.isRunning) { this.isRunning = true; this.loop(); }
    }
    loop() {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.update(); p.draw();
            if (p.isDead()) this.particles.splice(i, 1);
        }
        if (this.particles.length > 0) requestAnimationFrame(this.loop.bind(this));
        else { this.isRunning = false; this.context.clearRect(0, 0, this.canvas.width, this.canvas.height); }
    }
}

class AppState {
    constructor() {
        this.state = { 
            teams: [
                { id: 't_verde', name: 'Time Verde', theme: 'theme-verde', icon: 'shield' },
                { id: 't_amarelo', name: 'Time Amarelo', theme: 'theme-amarelo', icon: 'crown' }
            ],
            players: [], 
            logs: [] 
        };
        this.listeners = [];
        this.initSync();
    }
    
    initSync() {
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (!data.teams) {
                    data.teams = [
                        { id: 't_verde', name: data.teamA || 'Time Verde', theme: 'theme-verde', icon: 'shield' },
                        { id: 't_amarelo', name: data.teamB || 'Time Amarelo', theme: 'theme-amarelo', icon: 'crown' }
                    ];
                    data.players = (data.players || []).map(p => ({
                        ...p,
                        teamId: p.team === 'a' ? 't_verde' : 't_amarelo'
                    }));
                    delete data.teamA;
                    delete data.teamB;
                    this.state = data;
                    this.pushToRemote();
                } else {
                    this.state = data;
                }
                this.notify('REMOTE_SYNC', null);
            } else {
                this.pushToRemote();
            }
        });
    }

    async pushToRemote() {
        try { await setDoc(docRef, this.state); } 
        catch (error) { console.error("Erro ao sincronizar com Firebase:", error); }
    }

    subscribe(listener) { this.listeners.push(listener); }
    notify(event, data) { this.listeners.forEach(listener => listener(event, data, this.state)); }

    addTeam(name, theme, icon) {
        const id = 'team_' + Date.now().toString(36);
        this.state.teams.push({ id, name, theme, icon });
        this.notify('STRUCTURE_CHANGED', null);
        this.pushToRemote();
    }

    removeTeam(id) {
        this.state.teams = this.state.teams.filter(t => t.id !== id);
        this.state.players = this.state.players.filter(p => p.teamId !== id);
        this.notify('STRUCTURE_CHANGED', null);
        this.pushToRemote();
    }

    addPlayer(name, teamId) {
        const id = 'player_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
        const newPlayer = { id, name, teamId, score: 0 };
        this.state.players.push(newPlayer);
        this.notify('STRUCTURE_CHANGED', null);
        this.pushToRemote();
    }

    removePlayer(id) {
        this.state.players = this.state.players.filter(p => p.id !== id);
        this.notify('STRUCTURE_CHANGED', null);
        this.pushToRemote();
    }

    incrementScore(id) {
        const player = this.state.players.find(p => p.id === id);
        if (player) {
            player.score += 1;
            const logEntry = {
                id: 'log_' + Date.now().toString(36),
                playerName: player.name,
                teamId: player.teamId,
                time: new Date().toLocaleTimeString('pt-BR')
            };
            this.state.logs.unshift(logEntry);
            this.notify('SCORE_CHANGED', { player, logEntry });
            this.pushToRemote();
        }
    }

    decrementScore(id) {
        const player = this.state.players.find(p => p.id === id);
        if (player && player.score > 0) {
            player.score -= 1;
            const logIndex = this.state.logs.findIndex(l => l.playerName === player.name);
            if (logIndex !== -1) this.state.logs.splice(logIndex, 1);
            this.notify('SCORE_CHANGED', { player });
            this.pushToRemote();
        }
    }

    resetAll() {
        this.state.players.forEach(p => p.score = 0);
        this.state.logs = [];
        this.notify('STRUCTURE_CHANGED', null);
        this.pushToRemote();
    }
}

class UIManager {
    constructor(stateManager, confettiEngine) {
        this.stateManager = stateManager;
        this.confetti = confettiEngine;
        this.elements = {
            tabs: document.querySelectorAll('.tab-button'),
            views: document.querySelectorAll('.view-container'),
            
            inputNewTeamName: document.getElementById('input-new-team-name'),
            selectNewTeamTheme: document.getElementById('select-new-team-theme'),
            selectNewTeamIcon: document.getElementById('select-new-team-icon'),
            btnAddTeam: document.getElementById('btn-add-team'),
            teamsAdminList: document.getElementById('teams-admin-list'),

            inputPlayerName: document.getElementById('input-player-name'),
            selectPlayerTeam: document.getElementById('select-player-team'),
            btnAddPlayer: document.getElementById('btn-add-player'),
            playersAdminList: document.getElementById('players-list-admin'),
            
            scoreboardTopContainer: document.getElementById('scoreboard-top-container'),
            teamCardsGrid: document.getElementById('team-cards-grid'),
            displayTotal: document.getElementById('display-total-score'),
            logList: document.getElementById('log-list'),
            btnResetAll: document.getElementById('btn-reset-all'),
            toastRoot: document.getElementById('toast-root'),
            modalRoot: document.getElementById('modal-root')
        };
        this.bindEvents();
        this.stateManager.subscribe(this.handleStateChange.bind(this));
    }

    bindEvents() {
        this.elements.tabs.forEach(tab => tab.addEventListener('click', (e) => this.switchTab(e.currentTarget)));
        
        this.elements.btnAddTeam.addEventListener('click', () => {
            const name = this.elements.inputNewTeamName.value.trim();
            const theme = this.elements.selectNewTeamTheme.value;
            const icon = this.elements.selectNewTeamIcon.value;
            if (name) {
                this.stateManager.addTeam(name, theme, icon);
                this.elements.inputNewTeamName.value = '';
                this.showToast(`Equipe ${name} criada.`, 'success');
            } else this.showToast('Informe o nome da equipe.', 'danger');
        });

        const addPlayerHandler = () => {
            const name = this.elements.inputPlayerName.value.trim();
            const teamId = this.elements.selectPlayerTeam.value;
            if (name && teamId) {
                this.stateManager.addPlayer(name, teamId);
                this.elements.inputPlayerName.value = '';
                this.elements.inputPlayerName.focus();
                this.showToast(`Jogador recrutado.`, 'success');
            } else {
                this.showToast('Preencha os dados do jogador.', 'danger');
            }
        };
        
        this.elements.btnAddPlayer.addEventListener('click', addPlayerHandler);
        this.elements.inputPlayerName.addEventListener('keypress', (e) => { if (e.key === 'Enter') addPlayerHandler(); });
        
        this.elements.btnResetAll.addEventListener('click', () => {
            this.showModal('Atenção Crítica', 'Tem certeza que deseja zerar completamente o placar e histórico? Esta ação é irreversível.', () => {
                this.stateManager.resetAll();
                this.showToast('Placar reiniciado com sucesso.', 'success');
            });
        });
    }

    handleStateChange(event, data, state) {
        if (event === 'REMOTE_SYNC' || event === 'STRUCTURE_CHANGED') {
            this.fullRender(state);
            return;
        }
        if (event === 'SCORE_CHANGED') {
            this.updateScoreboardsDOM(state);
            this.fullRenderLogs(state);
            this.animateScorePulse(data.player.teamId);
            if(data.logEntry) this.triggerConfetti();
        }
    }

    fullRender(state) {
        this.fullRenderTeamsAdmin(state);
        this.fullRenderPlayerSelect(state);
        this.fullRenderPlayersAdmin(state);
        this.fullRenderScoreboard(state);
        this.updateScoreboardsDOM(state);
        this.fullRenderLogs(state);
    }

    fullRenderTeamsAdmin(state) {
        this.elements.teamsAdminList.innerHTML = '';
        if (state.teams.length === 0) {
            this.renderEmptyState(this.elements.teamsAdminList, 'Nenhuma equipe configurada.');
            return;
        }
        state.teams.forEach(team => {
            const item = this.createElement('div', ['list-item', team.theme]);
            const avatar = this.createElement('div', ['avatar', 'dyn-border', 'dyn-bg', 'dyn-color']);
            avatar.appendChild(this.createSVGIcon(team.icon));
            const info = this.createElement('div', ['item-info']);
            const nameEl = this.createElement('span', ['item-name', 'dyn-color']); nameEl.textContent = team.name;
            info.appendChild(nameEl);
            const btn = this.createElement('button', ['btn-icon', 'danger'], { title: 'Remover Equipe' });
            btn.appendChild(this.createSVGIcon('trash'));
            btn.addEventListener('click', () => {
                this.showModal('Confirmar', `Remover a equipe ${team.name} e todos os seus jogadores?`, () => this.stateManager.removeTeam(team.id));
            });
            item.append(avatar, info, btn);
            this.elements.teamsAdminList.appendChild(item);
        });
    }

    fullRenderPlayerSelect(state) {
        this.elements.selectPlayerTeam.innerHTML = '';
        state.teams.forEach(team => {
            const opt = document.createElement('option');
            opt.value = team.id;
            opt.textContent = team.name;
            this.elements.selectPlayerTeam.appendChild(opt);
        });
    }

    fullRenderPlayersAdmin(state) {
        this.elements.playersAdminList.innerHTML = '';
        if (state.players.length === 0) {
            this.renderEmptyState(this.elements.playersAdminList, 'O elenco está vazio.');
            return;
        }
        state.players.forEach(player => {
            const team = state.teams.find(t => t.id === player.teamId);
            if (!team) return;
            const item = this.createElement('div', ['list-item', team.theme]);
            const avatar = this.createElement('div', ['avatar', 'dyn-border', 'dyn-bg', 'dyn-color']);
            avatar.appendChild(this.createSVGIcon('user'));
            const info = this.createElement('div', ['item-info']);
            const nameEl = this.createElement('span', ['item-name']); nameEl.textContent = player.name;
            const tag = this.createElement('span', ['tag', 'dyn-bg', 'dyn-color']); tag.textContent = team.name;
            info.append(nameEl, tag);
            const score = this.createElement('span', ['item-score']); score.textContent = player.score;
            const btn = this.createElement('button', ['btn-icon', 'danger'], { title: 'Remover Jogador' });
            btn.appendChild(this.createSVGIcon('trash'));
            btn.addEventListener('click', () => this.stateManager.removePlayer(player.id));
            item.append(avatar, info, score, btn);
            this.elements.playersAdminList.appendChild(item);
        });
    }

    fullRenderScoreboard(state) {
        this.elements.scoreboardTopContainer.innerHTML = '';
        this.elements.teamCardsGrid.innerHTML = '';
        
        state.teams.forEach(team => {
            const topDisp = this.createElement('div', ['team-display', team.theme]);
            const shield = this.createElement('div', ['shield', 'dyn-border', 'dyn-bg', 'dyn-color', 'dyn-glow']);
            shield.appendChild(this.createSVGIcon(team.icon, '32'));
            const nameDisp = this.createElement('div', ['team-name-display', 'dyn-color']); nameDisp.textContent = team.name;
            const scoreDisp = this.createElement('div', ['score-number', 'dyn-color'], { id: `score-top-${team.id}` }); scoreDisp.textContent = '0';
            topDisp.append(shield, nameDisp, scoreDisp);
            this.elements.scoreboardTopContainer.appendChild(topDisp);

            const card = this.createElement('div', ['card', team.theme]);
            const header = this.createElement('div', ['card-header', 'dyn-border-bottom']);
            const title = this.createElement('h2', ['card-title', 'dyn-color']); title.textContent = team.name;
            header.appendChild(title);
            const list = this.createElement('div', ['list-container'], { id: `list-score-${team.id}` });
            
            const teamPlayers = state.players.filter(p => p.teamId === team.id);
            if(teamPlayers.length === 0) {
                this.renderEmptyState(list, 'Sem escalação');
            } else {
                teamPlayers.forEach(player => {
                    const row = this.createElement('div', ['player-score-row']);
                    const pName = this.createElement('span', ['psr-name']); pName.textContent = player.name;
                    const pScore = this.createElement('span', ['psr-score'], { id: `score-val-${player.id}` }); pScore.textContent = player.score;
                    
                    const btnMinus = this.createElement('button', ['btn-action'], { title: 'Remover dose' });
                    btnMinus.appendChild(this.createSVGIcon('minus'));
                    btnMinus.addEventListener('click', () => this.stateManager.decrementScore(player.id));
                    
                    const btnPlus = this.createElement('button', ['btn-action', 'dyn-color', 'dyn-border-solid'], { title: 'Marcar dose' });
                    btnPlus.appendChild(this.createSVGIcon('plus'));
                    btnPlus.addEventListener('click', () => this.stateManager.incrementScore(player.id));
                    
                    row.append(pName, pScore, btnMinus, btnPlus);
                    list.appendChild(row);
                });
            }
            card.append(header, list);
            this.elements.teamCardsGrid.appendChild(card);
        });
    }

    updateScoreboardsDOM(state) {
        let total = 0;
        let maxScore = -1;
        const scores = {};

        state.teams.forEach(t => scores[t.id] = 0);
        state.players.forEach(p => {
            if(scores[p.teamId] !== undefined) scores[p.teamId] += p.score;
            total += p.score;
            const viewScore = document.getElementById(`score-val-${p.id}`);
            if(viewScore) viewScore.textContent = p.score;
        });

        Object.keys(scores).forEach(teamId => {
            if(scores[teamId] > maxScore) maxScore = scores[teamId];
        });

        state.teams.forEach(team => {
            const el = document.getElementById(`score-top-${team.id}`);
            if (el) {
                el.textContent = scores[team.id];
                el.classList.remove('leader');
                if(scores[team.id] === maxScore && maxScore > 0) el.classList.add('leader');
            }
        });
        this.elements.displayTotal.textContent = total;
    }

    fullRenderLogs(state) {
        this.elements.logList.innerHTML = '';
        if (state.logs.length === 0) {
            this.renderEmptyState(this.elements.logList, 'Nenhum registro.');
            return;
        }
        const sortedLogs = [...state.logs].sort((a,b) => b.id.localeCompare(a.id));
        sortedLogs.forEach((log, index) => {
            const team = state.teams.find(t => t.id === log.teamId);
            if(!team) return;
            const entry = this.createElement('div', ['log-entry', team.theme]);
            const seq = this.createElement('span', ['log-seq']); seq.textContent = sortedLogs.length - index;
            const name = this.createElement('span', ['log-name']); name.textContent = log.playerName;
            const tag = this.createElement('span', ['tag', 'dyn-bg', 'dyn-color']); tag.textContent = team.name;
            const time = this.createElement('span', ['log-time']); time.textContent = log.time;
            entry.append(seq, name, tag, time);
            this.elements.logList.appendChild(entry);
        });
    }

    switchTab(targetTab) {
        const targetId = targetTab.getAttribute('data-target');
        if (targetTab.classList.contains('active')) return;
        this.elements.tabs.forEach(tab => tab.classList.remove('active'));
        targetTab.classList.add('active');
        const currentView = document.querySelector('.view-container.active');
        const nextView = document.getElementById(targetId);
        gsap.to(currentView, {
            opacity: 0, y: -10, duration: 0.2,
            onComplete: () => {
                currentView.classList.remove('active');
                nextView.classList.add('active');
                gsap.fromTo(nextView, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' });
            }
        });
    }

    animateScorePulse(teamId) {
        const el = document.getElementById(`score-top-${teamId}`);
        if(el) gsap.timeline().to(el, { scale: 1.2, duration: 0.1, ease: 'power2.out' }).to(el, { scale: 1, duration: 0.3, ease: 'bounce.out' });
    }

    triggerConfetti() {
        this.confetti.burst(window.innerWidth / 2, window.innerHeight * 0.2);
    }

    createElement(tag, classNames = [], attributes = {}) {
        const el = document.createElement(tag);
        if (classNames.length) el.classList.add(...classNames);
        for (const [key, value] of Object.entries(attributes)) el.setAttribute(key, value);
        return el;
    }

    createSVGIcon(type, size = '16') {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', size); svg.setAttribute('height', size);
        svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor'); svg.setAttribute('stroke-width', '2.2');
        svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round');
        
        if (type === 'user') {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2');
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('cx', '12'); c.setAttribute('cy', '7'); c.setAttribute('r', '4');
            svg.append(p, c);
        } else if (type === 'trash') {
            const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'polyline'); p1.setAttribute('points', '3 6 5 6 21 6');
            const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p2.setAttribute('d', 'M19 6l-1 14H6L5 6');
            const p3 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p3.setAttribute('d', 'M10 11v6');
            const p4 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p4.setAttribute('d', 'M14 11v6');
            svg.append(p1, p2, p3, p4);
        } else if (type === 'plus') {
            const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'line'); p1.setAttribute('x1', '12'); p1.setAttribute('y1', '5'); p1.setAttribute('x2', '12'); p1.setAttribute('y2', '19');
            const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'line'); p2.setAttribute('x1', '5'); p2.setAttribute('y1', '12'); p2.setAttribute('x2', '19'); p2.setAttribute('y2', '12');
            svg.append(p1, p2);
        } else if (type === 'minus') {
            const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'line'); p1.setAttribute('x1', '5'); p1.setAttribute('y1', '12'); p1.setAttribute('x2', '19'); p1.setAttribute('y2', '12');
            svg.appendChild(p1);
        } else if (type === 'shield') {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z');
            svg.appendChild(p);
        } else if (type === 'crown') {
            const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p1.setAttribute('d', 'M2 22h20');
            const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p2.setAttribute('d', 'M2 18l5-10 5 6 5-6 5 10H2z');
            svg.append(p1, p2);
        } else if (type === 'sword') {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', 'M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2');
            svg.appendChild(p);
        } else if (type === 'star') {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon'); p.setAttribute('points', '12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2');
            svg.appendChild(p);
        } else if (type === 'zap') {
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon'); p.setAttribute('points', '13 2 3 14 12 14 11 22 21 10 12 10 13 2');

    renderEmptyState(container, message) {
        if (container.querySelector('.empty-state')) return;
        const empty = this.createElement('div', ['empty-state']); empty.textContent = message;
        container.appendChild(empty);
    }

    showToast(message, type = 'success') {
        const toast = this.createElement('div', ['toast', type]);
        const iconDiv = this.createElement('div', ['toast-icon']);
        const svg = this.createSVGIcon(type === 'success' ? 'plus' : 'minus', '20');
        iconDiv.appendChild(svg);
        const textDiv = this.createElement('div'); textDiv.textContent = message;
        toast.append(iconDiv, textDiv);
        this.elements.toastRoot.appendChild(toast);
        gsap.fromTo(toast, { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.3, ease: 'back.out(1.5)' });
        setTimeout(() => gsap.to(toast, { opacity: 0, x: 50, duration: 0.3, ease: 'power2.in', onComplete: () => toast.remove() }), 3000);
    }

    showModal(title, message, onConfirm) {
        this.elements.modalRoot.innerHTML = '';
        const content = this.createElement('div', ['modal-content']);
        const header = this.createElement('div', ['modal-header']);
        const svg = this.createSVGIcon('minus', '24');
        svg.style.stroke = 'var(--color-danger)';
        const titleEl = this.createElement('h3', ['modal-title']); titleEl.textContent = title;
        header.append(svg, titleEl);
        const bodyEl = this.createElement('p', ['modal-body']); bodyEl.textContent = message;
        const actions = this.createElement('div', ['modal-actions']);
        const btnCancel = this.createElement('button', ['btn', 'btn-outline']); btnCancel.textContent = 'Cancelar';
        const btnConfirm = this.createElement('button', ['btn', 'btn-danger']); btnConfirm.textContent = 'Confirmar Ação';
        
        const closeModal = () => {
            gsap.to(content, { y: 20, opacity: 0, duration: 0.2 });
            gsap.to(this.elements.modalRoot, { opacity: 0, duration: 0.2, onComplete: () => this.elements.modalRoot.classList.remove('active') });
        };
        btnCancel.addEventListener('click', closeModal);
        btnConfirm.addEventListener('click', () => { onConfirm(); closeModal(); });
        actions.append(btnCancel, btnConfirm);
        content.append(header, bodyEl, actions);
        this.elements.modalRoot.appendChild(content);
        this.elements.modalRoot.classList.add('active');
        gsap.to(this.elements.modalRoot, { opacity: 1, duration: 0.2 });
        gsap.fromTo(content, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'back.out(1.2)' });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    
    const introOverlay = document.getElementById('intro-overlay');
    const introText = document.querySelector('.intro-text');
    const broadcastLine = document.querySelector('.broadcast-line');

    gsap.set(introText, { visibility: 'visible', x: '-100vw', opacity: 0 });
    gsap.set(broadcastLine, { scaleX: 0, transformOrigin: 'left' });

    const tlIntro = gsap.timeline({
        onComplete: () => {
            introOverlay.style.display = 'none';
        }
    });

    tlIntro.to(broadcastLine, {
        scaleX: 1,
        duration: 0.8,
        ease: "expo.inOut"
    })
    .to(introText, {
        x: '0vw',
        opacity: 1,
        duration: 1.2,
        ease: "expo.out"
    }, "-=0.3")
    .to(introText, {
        x: '3vw',
        duration: 2,
        ease: "sine.inOut"
    }, "-=0.8")
    .to(introText, {
        x: '100vw',
        opacity: 0,
        duration: 0.8,
        ease: "expo.in"
    })
    .to(broadcastLine, {
        scaleX: 0,
        transformOrigin: 'right',
        duration: 0.6,
        ease: "expo.inOut"
    }, "-=0.6")
    .to(introOverlay, {
        opacity: 0,
        duration: 0.5,
        ease: "power2.inOut"
    }, "-=0.2");

    const appState = new AppState();
    const confettiEngine = new ConfettiEngine('canvas-confetti');
    const uiManager = new UIManager(appState, confettiEngine);
    
});
</script>
